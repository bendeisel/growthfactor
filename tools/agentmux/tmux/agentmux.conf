# agentmux tmux layer
#
#   source-file ~/path/to/tools/agentmux/tmux/agentmux.conf
#
# Requires `agentmux` on PATH. Each window carries @agentmux_state, set by the
# Claude Code hooks: working | waiting | idle | done.

set -g status-interval 5
set -g renumber-windows on
set -g mouse on

# Vertical-ish workspace list on the left, mirroring what cmux puts in its
# sidebar: a state marker, the window number and the workspace name.
set -g status-justify left
set -g status-left-length 20
set -g status-right-length 60

set -g window-status-format "#[fg=colour244] #I #{?#{==:#{@agentmux_state},waiting},#[fg=colour214]!,#{?#{==:#{@agentmux_state},working},#[fg=colour71]*,#{?#{==:#{@agentmux_state},idle},#[fg=colour244]-,#[fg=colour238].}}} #W "
set -g window-status-current-format "#[fg=colour252,bold] #I #{?#{==:#{@agentmux_state},waiting},#[fg=colour214]!,#{?#{==:#{@agentmux_state},working},#[fg=colour71]*,#{?#{==:#{@agentmux_state},idle},#[fg=colour252]-,#[fg=colour244].}}}#[fg=colour252,bold] #W "

# A window whose agent is waiting on you keeps a marker even when unfocused.
set -g window-status-bell-style "fg=colour214,bold"

set -g status-left "#[fg=colour109,bold] #S #[default]"
set -g status-right "#[fg=colour214]#(agentmux tmux-status)#[default] #[fg=colour244]%H:%M "

# Jump to the next workspace that needs a human.
bind -N "next waiting agent" a run-shell "agentmux tmux-next-waiting"

# Workspace management without leaving tmux.
bind -N "new agent workspace" A command-prompt -p "workspace name:" "run-shell 'agentmux new %% --no-attach'"
bind -N "list agent workspaces" L display-popup -E -w 80% -h 60% "agentmux ls; echo; read -n 1 -s -r -p 'press any key'"
